# Taxonomia de tags do portal (plugin `starlight-tags`).
#
# Uma tag usada no frontmatter sem estar declarada aqui é criada automaticamente
# (`onInlineTagsNotFound: 'create'` no astro.config.mjs), então este arquivo
# serve para dar rótulo, descrição e cor às tags que importam — não para
# autorizar o uso.
#
# O rótulo aceita string ou um mapa de idiomas, o que mantém a taxonomia
# coerente nas três localidades do portal.
#
# Use em qualquer página:
#
#     ---
#     title: Autenticação
#     tags: [api, seguranca]
#     ---

tags:
  api:
    label:
      pt-BR: API
      en: API
      es: API
    description:
      pt-BR: Referência e comportamento da API.
      en: API reference and behavior.
      es: Referencia y comportamiento de la API.
    color: '#3b82f6'

  seguranca:
    label:
      pt-BR: Segurança
      en: Security
      es: Seguridad
    description:
      pt-BR: Autenticação, autorização e proteção de credenciais.
      en: Authentication, authorization, and credential protection.
      es: Autenticación, autorización y protección de credenciales.
    color: '#ef4444'

  editor:
    label:
      pt-BR: Editor
      en: Editor
      es: Editor
    description:
      pt-BR: O editor de documentação do portal.
      en: The portal documentation editor.
      es: El editor de documentación del portal.
    color: '#8b5cf6'

  guia:
    label:
      pt-BR: Guia
      en: Guide
      es: Guía
    description:
      pt-BR: Passo a passo e material introdutório.
      en: Step-by-step and introductory material.
      es: Paso a paso y material introductorio.
    color: '#22c55e'

  ia:
    label:
      pt-BR: IA
      en: AI
      es: IA
    description:
      pt-BR: Recursos voltados a agentes e assistentes.
      en: Features aimed at agents and assistants.
      es: Funciones orientadas a agentes y asistentes.
    color: '#f59e0b'

  autenticacao:
    label:
      pt-BR: Autenticação
      en: Authentication
      es: Autenticación
    description:
      pt-BR: Credenciais, tokens e como provar identidade na API.
      en: Credentials, tokens and how to prove identity to the API.
      es: Credenciales, tokens y cómo probar identidad ante la API.
    color: '#8b5cf6'

  erros:
    label:
      pt-BR: Erros
      en: Errors
      es: Errores
    description:
      pt-BR: Códigos de erro, formato das respostas e o que fazer com cada um.
      en: Error codes, response format and what to do about each one.
      es: Códigos de error, formato de las respuestas y qué hacer con cada uno.
    color: '#ef4444'

  eventos:
    label:
      pt-BR: Eventos
      en: Events
      es: Eventos
    description:
      pt-BR: Canais, mensagens e integração orientada a eventos.
      en: Channels, messages and event-driven integration.
      es: Canales, mensajes e integración orientada a eventos.
    color: '#14b8a6'

  changelog:
    label:
      pt-BR: Changelog
      en: Changelog
      es: Historial
    description:
      pt-BR: Alterações que afetam integrações existentes.
      en: Changes that affect existing integrations.
      es: Cambios que afectan integraciones existentes.
    color: '#f59e0b'

  configuracao:
    label:
      pt-BR: Configuração
      en: Configuration
      es: Configuración
    description:
      pt-BR: Ajustes do portal — marca, idiomas, navegação, integrações.
      en: Portal settings — branding, languages, navigation, integrations.
      es: Ajustes del portal — marca, idiomas, navegación, integraciones.
    color: '#64748b'

  publicacao:
    label:
      pt-BR: Publicação
      en: Publishing
      es: Publicación
    description:
      pt-BR: Como o conteúdo escrito chega ao ar.
      en: How written content reaches production.
      es: Cómo el contenido escrito llega al aire.
    color: '#22c55e'

  conteudo:
    label:
      pt-BR: Conteúdo
      en: Content
      es: Contenido
    description:
      pt-BR: Reuso, condicionais e organização do texto.
      en: Reuse, conditionals and text organization.
      es: Reutilización, condicionales y organización del texto.
    color: '#a855f7'

  portal:
    label:
      pt-BR: Portal
      en: Portal
      es: Portal
    description:
      pt-BR: O portal em si — navegação, busca, recursos de leitura.
      en: The portal itself — navigation, search, reading features.
      es: El portal en sí — navegación, búsqueda, funciones de lectura.
    color: '#0ea5e9'
