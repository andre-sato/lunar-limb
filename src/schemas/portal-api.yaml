openapi: 3.1.0

info:
  title: API do portal
  version: '1.0.0'
  description: |
    Endpoints do próprio portal, usados pela interface.

    Esta especificação existe por dois motivos: documentar o que o portal expõe
    e dar ao API Explorer uma API **real** para chamar. Uma especificação de
    exemplo com endpoints inventados demonstraria a ferramenta e mentiria sobre
    o produto.

    Quase tudo aqui exige sessão. O Explorer roda no mesmo domínio, então o
    cookie de sessão acompanha a chamada quando você está autenticado.

servers:
  - url: /api
    description: O próprio portal

paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Quem está autenticado
      description: Devolve o usuário da sessão atual, ou 401 quando não há sessão.
      tags: [autenticação]
      responses:
        '200':
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Sem sessão

  /chat/message:
    post:
      operationId: searchDocumentation
      summary: Busca conversacional na documentação
      description: |
        Recebe uma pergunta em linguagem natural e devolve um resumo extrativo,
        os trechos encontrados e os links das páginas. Não há modelo de
        linguagem: o resumo cita a documentação.
      tags: [documentação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Resposta com trechos e fontes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '401':
          description: Sem sessão
        '429':
          description: Limite de uso atingido

  /editor/git/branches:
    get:
      operationId: listBranches
      summary: Branches do repositório
      description: Lista as branches locais, indicando a atual e a padrão.
      tags: [workflow]
      responses:
        '200':
          description: Lista de branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '401':
          description: Sem sessão
        '403':
          description: Sem a permissão `editor.access`

  /editor/lint:
    post:
      operationId: lintContent
      summary: Analisa um texto Markdown
      description: |
        Roda o linter sobre o conteúdo enviado e devolve a nota, o veredito do
        quality gate e os apontamentos com linha e coluna.
      tags: [qualidade]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LintRequest'
      responses:
        '200':
          description: Resultado da análise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LintResult'
        '401':
          description: Sem sessão

  /feedback:
    post:
      operationId: sendFeedback
      summary: Registra o feedback de uma página
      description: Guarda o voto de utilidade de uma página da documentação.
      tags: [documentação]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Registrado
        '400':
          description: Corpo inválido

security:
  - sessionCookie: []

components:
  # Schemas nomeados.
  #
  # Eles existem para que o contrato tenha vocabulário próprio: `SearchAnswer` é
  # um conceito do produto, e repeti-lo inline em cada operação produziria cópias
  # que envelhecem separadamente. O SDK gerado tipa a partir daqui — expandir o
  # `$ref` daria vinte cópias da mesma forma e nenhuma com nome.
  schemas:
    User:
      type: object
      description: Um usuário do portal.
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [viewer, editor, admin]
          description: Papel que decide o que a pessoa pode ver e editar.

    CurrentUser:
      type: object
      description: A sessão atual.
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    SearchRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: A pergunta, em português, inglês ou espanhol.
          example: como autenticar na API
        conversationId:
          type: string
          description: Continua uma conversa existente.

    Excerpt:
      type: object
      description: Um trecho da documentação, já recortado.
      required: [title, text, url, path]
      properties:
        title: { type: string }
        section: { type: string }
        text:
          type: string
          description: Texto do trecho, com credenciais redigidas.
        url: { type: string }
        path:
          type: string
          description: Caminho da página em `src/content/docs`.

    Source:
      type: object
      description: Uma página citada na resposta.
      required: [documentId, title, url, relevance]
      properties:
        documentId: { type: string }
        title: { type: string }
        url: { type: string }
        relevance:
          type: number
          description: Maior relevância entre os trechos desta página.

    SearchAnswer:
      type: object
      description: |
        Resposta da busca. O `message` é uma frase de enquadramento extrativa —
        não há modelo de linguagem gerando texto novo.
      required: [message, excerpts, sources, empty]
      properties:
        message: { type: string }
        excerpts:
          type: array
          items:
            $ref: '#/components/schemas/Excerpt'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        empty:
          type: boolean
          description: Verdadeiro quando nada passou do limiar de relevância.
        conversationId: { type: string }

    Branch:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ahead:
          type: integer
          description: Commits à frente do remoto.
        behind:
          type: integer
          description: Commits atrás do remoto.

    BranchList:
      type: object
      required: [current, branches]
      properties:
        current: { type: string }
        defaultBranch: { type: string }
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'

    LintRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: O Markdown a analisar, com frontmatter.
        path:
          type: string
          description: Caminho relativo, usado para regras por tipo de página.

    LintFinding:
      type: object
      description: Um apontamento do linter, com onde ele está.
      required: [rule, message, severity]
      properties:
        rule: { type: string }
        message: { type: string }
        severity:
          type: string
          enum: [error, warning, info]
        line: { type: integer }
        column: { type: integer }

    LintResult:
      type: object
      required: [score, gate, findings]
      properties:
        score:
          type: number
          description: Nota de 0 a 100.
        gate:
          type: string
          enum: [pass, warning, fail]
        findings:
          type: array
          items:
            $ref: '#/components/schemas/LintFinding'

    FeedbackRequest:
      type: object
      required: [path, vote]
      properties:
        path:
          type: string
          description: Caminho da página avaliada.
          example: /guides/getting-started/
        vote:
          type: string
          enum: [up, down]

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
      description: |
        Cookie de sessão do portal, definido em `POST /api/auth/login`. Como o
        Explorer roda no mesmo domínio, o navegador o envia sozinho — não é
        preciso preencher nada aqui quando você já está autenticado.
