[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-docs-cli"
version = "0.1.0"
description = "CLI e MCP Server para consultar documentação técnica pelo terminal"
readme = "README.md"
# Sem `license` declarada: o repositório principal também não declara uma, e
# escolher uma licença é decisão do dono do projeto, não do empacotamento.
# Publicar no PyPI exigirá preencher este campo.
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# O provedor de LLM é opcional: sem ele o `doc ask` responde com os trechos
# recuperados e as fontes, em vez de falhar (ver §27 e o README).
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
doc = "mcp_docs.cli.main:main"
doc-index = "mcp_docs.indexer.cli:main"
doc-mcp-server = "mcp_docs.server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
