# Documentation Observability & SLO — alvos e orçamentos.
#
# Versionado no Git de propósito: um alvo de qualidade é um acordo da equipe, e
# acordo que só existe na tela de configuração de alguém não sobrevive à troca de
# time.
#
# O destino do webhook de alerta **não** fica aqui — ele vem de
# `DOCS_HEALTH_WEBHOOK` no ambiente, porque URL de webhook costuma carregar
# segredo no próprio caminho.

documentation:
  slo:
    # Mínimo do score geral. Abaixo disso, `npm run docs:health -- check` falha.
    healthScore:
      minimum: 90

    # `target` (ou `minimum`) é o alvo; `warning` é quantos pontos abaixo dele
    # ainda contam como "em risco" em vez de violação. Sem essa faixa o painel
    # alterna entre verde e vermelho a cada ponto, e a equipe aprende a ignorar o
    # vermelho.
    quality:
      target: 90
      warning: 5

    # Contrato é o mais rígido depois dos absolutos: documentação que diverge do
    # contrato leva quem lê a errar com confiança.
    contractIntegrity:
      target: 99
      warning: 4

    coverage:
      target: 90
      warning: 10

    freshness:
      target: 95
      warning: 10

    reliability:
      target: 99
      warning: 4

    trust:
      target: 90
      warning: 15

    aiReadiness:
      target: 90
      warning: 10

    consistency:
      target: 90
      warning: 5

    testCoverage:
      target: 90
      warning: 10

    accessibility:
      target: 95
      warning: 5

    # Error budget: contagem absoluta de defeitos tolerados, não percentual.
    #
    # Zero nos dois que não têm justificativa que valha a discussão — link morto e
    # contrato quebrado. Orçamento zero é caso normal: sem ocorrência ele está
    # inteiro, e com uma ele estoura.
    brokenLinks: 0
    contractFailures: 0
    failedExamples: 2
    staleContent: 5

  analytics:
    # Guardar o **texto** das perguntas que a busca não conseguiu responder.
    #
    # Desligado por padrão, e a escolha é deliberada. O portal já decidiu não
    # guardar perguntas nem respostas do chatbot: é onde as pessoas escrevem o que
    # não sabem, às vezes junto com o que estão construindo, e isso seria o dado
    # mais sensível daqui.
    #
    # Ligado, guarda **apenas** a pergunta que ficou sem resposta — sem quem
    # perguntou, truncada, com credenciais redigidas e com teto de registros.
    # Desligado, as lacunas continuam sendo detectadas pelos outros sinais:
    # endpoint sem página, voto negativo, evidência inválida, teste falhando.
    storeUnansweredQuestions: true

    # Observabilidade de leitura (P3.2).
    #
    # Nada aqui identifica uma pessoa: o evento não tem onde guardar IP, id de
    # usuário ou cookie. O que existe é uma sessão efêmera, gerada no navegador,
    # que some quando a aba fecha.
    observability:
      enabled: true
      # Evento mais velho que isto é apagado na próxima escrita — não num
      # processo de limpeza separado, que é o processo que ninguém lembra de
      # rodar e que deixa dado vivo além do prazo.
      retentionDays: 90
      # Mínimo de sessões distintas para uma linha aparecer no relatório. Com 1,
      # "quem leu esta página" pode ser uma pessoa identificável para quem
      # conhece a equipe, e a agregação deixa de agregar.
      minimumSessions: 3
      windowDays: 30
