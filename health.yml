# Documentation Health & SLO — alvos (§4).
#
# Versionado no Git de propósito: um alvo de qualidade é um acordo da equipe, e
# acordo que só existe na tela de configuração de alguém não sobrevive à troca de
# time.
#
# O destino do webhook de alerta **não** fica aqui — ele vem de
# `DOCS_HEALTH_WEBHOOK` no ambiente, porque URL de webhook costuma carregar
# segredo no próprio caminho.

documentation:
  slo:
    # `target` é o alvo; `warning` é quantos pontos abaixo dele ainda contam como
    # "em risco" em vez de violação. Sem essa faixa o painel alterna entre verde e
    # vermelho a cada ponto, e a equipe aprende a ignorar o vermelho.
    quality:
      target: 90
      warning: 5
    freshness:
      target: 95
      warning: 10
    consistency:
      target: 90
      warning: 5
    testCoverage:
      target: 90
      warning: 10
    # Os dois absolutos: endpoint sem página e link morto não têm justificativa
    # que valha a discussão.
    apiCoverage:
      target: 100
      warning: 10
    brokenLinks: 0
    trust:
      target: 90
      warning: 15
    accessibility:
      target: 95
      warning: 5

  analytics:
    # Guardar o **texto** das perguntas que a busca não conseguiu responder.
    #
    # Desligado por padrão, e a escolha é deliberada. O portal já decidiu não
    # guardar perguntas nem respostas do chatbot: é onde as pessoas escrevem o que
    # não sabem, às vezes junto com o que estão construindo, e isso seria o dado
    # mais sensível daqui.
    #
    # Ligado, guarda **apenas** a pergunta que ficou sem resposta — sem quem
    # perguntou, truncada, com credenciais redigidas e com teto de registros.
    # Desligado, as lacunas continuam sendo detectadas pelos outros sinais:
    # endpoint sem página, voto negativo, evidência inválida, teste falhando. O
    # que se perde é a lista de perguntas, e essa perda é decisão de quem opera o
    # portal.
    storeUnansweredQuestions: false
